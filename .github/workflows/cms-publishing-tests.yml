name: Nawaz CMS publishing safety tests
on:
  push:
    branches: [main]
    paths:
      - "workers/admin/site-api.js"
      - "workers/admin/site-client.txt"
      - "workers/admin/backup-api.js"
      - "workers/admin/worker.js"
      - "workers/admin/site-page.html"
      - "tests/cms-publishing.test.mjs"
      - ".github/workflows/cms-publishing-tests.yml"
  workflow_dispatch:
jobs:
  verify-publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Workers and editor JavaScript syntax
        run: |
          set -euo pipefail
          node --input-type=module --check < workers/admin/worker.js
          node --input-type=module --check < workers/admin/site-api.js
          node --input-type=module --check < workers/admin/backup-api.js
          node --input-type=commonjs --check < workers/admin/site-client.txt
      - name: Test publishing conflicts, draft isolation and backup export
        run: node --experimental-default-type=module --experimental-sqlite tests/cms-publishing.test.mjs
      - name: Verify private CMS remains closed to anonymous visitors
        run: |
          set -euo pipefail
          base='https://nawaz-site-admin.nawaz-site-observer.workers.dev'
          for path in /admin/site /admin/api/backup /admin/api/site/pages /admin/builder; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$base$path")"
            test "$code" != 200 || { echo "SECURITY ERROR: anonymous visitor can access $path"; exit 1; }
          done
          echo 'PASS: anonymous visitors cannot access private CMS or backups'
