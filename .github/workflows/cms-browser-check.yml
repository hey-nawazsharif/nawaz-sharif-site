name: Nawaz CMS visual browser checks
on:
  pull_request:
    paths:
      - "tests/cms-browser.spec.cjs"
      - "index.html"
      - "articles.html"
      - "articles-dynamic.js"
      - "consent.js"
      - ".github/workflows/cms-browser-check.yml"
  push:
    branches: [main]
    paths:
      - "tests/cms-browser.spec.cjs"
      - "index.html"
      - "articles.html"
      - "articles-dynamic.js"
      - ".github/workflows/cms-browser-check.yml"
  workflow_dispatch:
jobs:
  preview-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify desktop/mobile CMS preview (never submit forms)
        run: npx playwright test tests/cms-browser.spec.cjs --reporter=line --workers=2
      - name: Preserve screenshots and failure traces for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cms-preview-browser-evidence
          path: |
            test-results/
          retention-days: 7
          if-no-files-found: ignore
