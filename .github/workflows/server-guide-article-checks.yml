name: Server guide hardware and installation quality checks
on:
  pull_request:
    paths:
      - 'what-is-server-types-hardware-installation-from-scratch.html'
      - 'assets/server-*.svg'
      - 'index.html'
      - 'articles.html'
      - 'sitemap.xml'
      - 'tests/test_server_zero_to_enterprise_article.py'
      - 'workers/migrations/0008_server_from_zero_article.sql'
      - '.github/workflows/server-guide-article-checks.yml'
  push:
    branches: [main]
    paths:
      - 'what-is-server-types-hardware-installation-from-scratch.html'
      - 'assets/server-*.svg'
      - 'index.html'
      - 'articles.html'
      - 'sitemap.xml'
      - 'tests/test_server_zero_to_enterprise_article.py'
      - 'workers/migrations/0008_server_from_zero_article.sql'
      - '.github/workflows/server-guide-article-checks.yml'
  workflow_dispatch:
jobs:
  article-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate server article illustrations, installation safety, maths, SEO and archive
        run: python tests/test_server_zero_to_enterprise_article.py
