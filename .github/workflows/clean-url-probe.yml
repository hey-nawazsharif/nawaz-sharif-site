name: Verify website clean URLs
on:
  pull_request:
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'articles-dynamic.js'
      - 'consent.js'
      - 'workers/cms/worker.js'
      - 'tests/clean-urls.test.mjs'
      - 'tests/cms-browser.spec.cjs'
      - '.github/workflows/clean-url-probe.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'sitemap.xml'
      - 'articles-dynamic.js'
      - 'workers/cms/worker.js'
      - 'tests/clean-urls.test.mjs'
      - '.github/workflows/clean-url-probe.yml'
  workflow_dispatch:
jobs:
  route-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check clean source links and SEO references
        run: node tests/clean-urls.test.mjs
      - name: Confirm public clean URLs stay accessible (no DNS changes)
        shell: bash
        run: |
          set -euo pipefail
          base='https://nawazsharif.in'
          for route in /articles /about /contact /faq /what-is-ai-history-and-evolution /articles.html; do
            code="$(curl -sS --retry 2 --max-time 30 -o /tmp/clean-site.html -w '%{http_code}' "$base$route")"
            test "$code" = 200 || { echo "$route: unexpected HTTP $code"; exit 1; }
            grep -iq '<html' /tmp/clean-site.html || { echo "$route: no HTML document"; exit 1; }
            echo "PASS: $route"
          done
