<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="t d"><title id="t">Car software update and cybersecurity trust boundaries</title><desc id="d">Original conceptual schematic with signed software update from manufacturer cloud to car telematics unit, verification and gateway then noncritical cockpit app domain separated from safety-critical brake and battery control ECUs.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#68d7d3"/></marker></defs><rect width="1200" height="555" rx="18" fill="#0b2136"/><g font-family="Arial,sans-serif"><text x="45" y="52" fill="white" font-size="27" font-weight="bold">Software-defined cars need trust boundaries</text><text x="45" y="82" fill="#b6d1df" font-size="16">High-level OTA and domain-separation concept, not an update installation procedure</text><rect x="50" y="143" width="258" height="155" rx="14" fill="#183e51" stroke="#5a97ac" stroke-width="2"/><text x="179" y="194" text-anchor="middle" fill="#f1ffff" font-size="21" font-weight="bold">Automaker cloud</text><text x="179" y="224" text-anchor="middle" fill="#b8dfe7" font-size="15">Signed update package</text><text x="179" y="247" text-anchor="middle" fill="#b8dfe7" font-size="15">Release and audit</text><rect x="385" y="143" width="260" height="155" rx="14" fill="#1e4d60" stroke="#64c5d1" stroke-width="2"/><text x="515" y="194" text-anchor="middle" fill="white" font-size="21" font-weight="bold">Vehicle gateway</text><text x="515" y="224" text-anchor="middle" fill="#b9eaed" font-size="15">Verify authorisation</text><text x="515" y="247" text-anchor="middle" fill="#b9eaed" font-size="15">Integrity and policy</text><path d="M311 220H381" fill="none" stroke="#68d7d3" stroke-width="3" marker-end="url(#a)"/><rect x="727" y="111" width="420" height="177" rx="15" fill="#173f58" stroke="#67b9cd" stroke-width="2"/><text x="937" y="158" text-anchor="middle" fill="white" font-size="22" font-weight="bold">Cockpit / infotainment</text><text x="937" y="192" text-anchor="middle" fill="#c5e2eb" font-size="16">Maps · media · voice · display</text><text x="937" y="224" text-anchor="middle" fill="#c5e2eb" font-size="16">App and OS updates</text><path d="M648 198H723" fill="none" stroke="#68d7d3" stroke-width="3" marker-end="url(#a)"/><rect x="727" y="349" width="420" height="147" rx="14" fill="#2a354c" stroke="#dba575" stroke-width="2"/><text x="937" y="390" text-anchor="middle" fill="#fff0db" font-size="21" font-weight="bold">Safety-critical vehicle domain</text><text x="937" y="425" text-anchor="middle" fill="#edd5c5" font-size="16">Brakes · steering · high-voltage battery</text><text x="937" y="455" text-anchor="middle" fill="#edd5c5" font-size="15">Strictly controlled interfaces and safety design</text><path d="M644 270H692V422H723" stroke="#dba575" stroke-width="3" stroke-dasharray="8 6" fill="none"/><text x="48" y="380" fill="#d4e8f0" font-size="16">Security design principles</text><text x="48" y="411" fill="#a8cbd9" font-size="15">• Authenticated update delivery</text><text x="48" y="437" fill="#a8cbd9" font-size="15">• Least-privilege vehicle APIs</text><text x="48" y="463" fill="#a8cbd9" font-size="15">• Isolated safety-related domains</text><text x="48" y="491" fill="#a8cbd9" font-size="15">• Rollback / recovery where supported</text><text x="48" y="530" fill="#c0d9e4" font-size="14">Not all EVs use the same architecture; implementations and legally required protections vary by jurisdiction.</text></g></svg>