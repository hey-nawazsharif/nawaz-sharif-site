<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="565" viewBox="0 0 1200 565" role="img" aria-labelledby="t d"><title id="t">Server form factor and work setting diagram</title><desc id="d">Server form factors from mini PC, tower, rack and blade to virtual cloud instances, with example settings from home to government. Physical form and business function are separate dimensions.</desc><rect width="1200" height="565" rx="18" fill="#0c1d31"/><g font-family="Arial,sans-serif"><text x="55" y="57" fill="white" font-size="28" font-weight="bold">A server type is not the same as its owner</text><text x="55" y="88" fill="#b8d2df" font-size="16">Hardware form factor / deployment model and use case are separate choices</text><g fill="#1a354a" stroke="#568399" stroke-width="2"><rect x="54" y="128" width="205" height="196" rx="11"/><rect x="276" y="128" width="205" height="196" rx="11"/><rect x="498" y="128" width="205" height="196" rx="11"/><rect x="720" y="128" width="205" height="196" rx="11"/><rect x="942" y="128" width="205" height="196" rx="11"/></g><rect x="111" y="181" width="92" height="81" rx="12" fill="#327595"/><g fill="#4a8ba5"><rect x="331" y="162" width="94" height="119" rx="7"/><rect x="542" y="179" width="114" height="21" rx="3"/><rect x="542" y="207" width="114" height="21" rx="3"/><rect x="542" y="235" width="114" height="21" rx="3"/><rect x="772" y="175" width="102" height="101" rx="9"/><rect x="978" y="185" width="138" height="74" rx="20"/></g><g fill="#e0f2f5" font-size="18" text-anchor="middle" font-weight="bold"><text x="156" y="302">Mini PC</text><text x="378" y="302">Tower</text><text x="600" y="302">Rack</text><text x="822" y="302">Modular / blade</text><text x="1044" y="302">Cloud VM</text></g><text x="56" y="368" fill="#d3ebf1" font-size="20" font-weight="bold">Common settings (examples, not fixed categories)</text><g fill="#16364c" stroke="#346c82"><rect x="56" y="396" width="165" height="105" rx="9"/><rect x="235" y="396" width="165" height="105" rx="9"/><rect x="414" y="396" width="165" height="105" rx="9"/><rect x="593" y="396" width="165" height="105" rx="9"/><rect x="772" y="396" width="165" height="105" rx="9"/><rect x="951" y="396" width="194" height="105" rx="9"/></g><g fill="#dff3f5" text-anchor="middle" font-size="17" font-weight="bold"><text x="138" y="434">Home lab</text><text x="318" y="434">Real estate</text><text x="496" y="434">Mini office</text><text x="676" y="434">Commercial</text><text x="854" y="434">MNC</text><text x="1048" y="434">Government</text></g><g fill="#a8c9d8" text-anchor="middle" font-size="13"><text x="138" y="463">Learning / NAS</text><text x="318" y="463">CRM / files</text><text x="496" y="463">File sharing</text><text x="676" y="463">Apps / ERP</text><text x="854" y="463">Clusters / cloud</text><text x="1048" y="463">Approved workloads</text></g><text x="57" y="539" fill="#aacad8" font-size="14">The same server can host multiple roles; a cloud VM can serve a one-person business or a national institution.</text></g></svg>