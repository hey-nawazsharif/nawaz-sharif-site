<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">Components inside a physical computer server</title><desc id="d">Server enclosure showing CPU sockets, eight ECC RAM modules, front SSD drive bays, expansion slots, network, redundant power supplies, system management and cooling fans. Layout is conceptual.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0c1930"/><stop offset="1" stop-color="#16364b"/></linearGradient></defs><rect width="1200" height="580" rx="18" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="50" y="58" font-weight="bold" font-size="28" fill="white">Inside a physical server</text><text x="50" y="88" font-size="17" fill="#b2cddb">Illustrative anatomy — layouts differ by server model</text><rect x="58" y="117" width="1084" height="345" rx="18" fill="#1a2b41" stroke="#80a1b3" stroke-width="3"/><rect x="83" y="143" width="226" height="282" rx="8" fill="#223d56"/><text x="197" y="169" text-anchor="middle" fill="#e6f4f7" font-weight="bold" font-size="18">HOT-SWAP SSD BAYS</text><g fill="#416b86" stroke="#95d7e3" stroke-width="2"><rect x="104" y="192" width="86" height="85" rx="7"/><rect x="201" y="192" width="86" height="85" rx="7"/><rect x="104" y="293" width="86" height="85" rx="7"/><rect x="201" y="293" width="86" height="85" rx="7"/></g><g text-anchor="middle" fill="white" font-size="17"><text x="147" y="242">SSD 1</text><text x="244" y="242">SSD 2</text><text x="147" y="344">SSD 3</text><text x="244" y="344">SSD 4</text></g><rect x="330" y="143" width="491" height="282" rx="8" fill="#1d3c52" stroke="#426c82"/><text x="576" y="170" text-anchor="middle" fill="#d9f4f5" font-size="18" font-weight="bold">SERVER MOTHERBOARD</text><rect x="355" y="205" width="124" height="94" rx="9" fill="#27678c" stroke="#73d2dd"/><text x="417" y="261" text-anchor="middle" fill="white" font-size="23" font-weight="bold">CPU</text><g fill="#68baa9"><rect x="511" y="198" width="18" height="105" rx="3"/><rect x="537" y="198" width="18" height="105" rx="3"/><rect x="563" y="198" width="18" height="105" rx="3"/><rect x="589" y="198" width="18" height="105" rx="3"/><rect x="615" y="198" width="18" height="105" rx="3"/><rect x="641" y="198" width="18" height="105" rx="3"/><rect x="667" y="198" width="18" height="105" rx="3"/><rect x="693" y="198" width="18" height="105" rx="3"/></g><text x="611" y="333" text-anchor="middle" fill="#d8eaf1" font-size="16">ECC DDR5 RAM slots</text><rect x="357" y="343" width="428" height="58" rx="9" fill="#295873"/><text x="571" y="378" text-anchor="middle" fill="#e4f8f9" font-size="18">PCIe / NIC / GPU expansion</text><rect x="841" y="143" width="273" height="282" rx="8" fill="#223d56"/><text x="978" y="169" text-anchor="middle" fill="white" font-size="18" font-weight="bold">POWER + COOLING</text><g fill="#284b69" stroke="#8bd7e0" stroke-width="3"><circle cx="902" cy="239" r="41"/><circle cx="1001" cy="239" r="41"/><circle cx="1090" cy="239" r="41"/></g><g fill="#88dbe1"><circle cx="902" cy="239" r="16"/><circle cx="1001" cy="239" r="16"/><circle cx="1090" cy="239" r="16"/></g><rect x="862" y="331" width="108" height="58" rx="8" fill="#3e6779"/><rect x="982" y="331" width="108" height="58" rx="8" fill="#3e6779"/><text x="917" y="367" text-anchor="middle" fill="white" font-size="15">PSU 1</text><text x="1036" y="367" text-anchor="middle" fill="white" font-size="15">PSU 2</text><text x="58" y="516" fill="#d6e7f1" font-size="17">Also present: BMC / remote-management port, BIOS/UEFI, network ports, storage controller, cables and sensors</text><text x="58" y="545" fill="#99bdcf" font-size="14">Not a scale drawing. Some servers omit dedicated GPUs, hot-swap bays or redundant power supplies.</text></g></svg>