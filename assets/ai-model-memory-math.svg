<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">AI model weight memory arithmetic for 70 billion parameter model</title><desc id="d">At 2 bytes per parameter, 70 billion parameters require 140 decimal gigabytes of raw weight storage. At four bits or half a byte, the ideal raw weights are 35 gigabytes, plus overhead. Runtime memory includes additional KV cache and temporary buffers.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b30"/><stop offset="1" stop-color="#113647"/></linearGradient></defs><rect width="1200" height="480" rx="18" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="54" y="54" fill="white" font-size="26" font-weight="bold">How much memory do AI model weights need?</text><text x="54" y="87" fill="#b8d1de" font-size="16">Illustrative 70-billion-parameter model · weight data only · decimal GB</text><text x="58" y="155" fill="#e7f4f6" font-size="20" font-weight="bold">16-bit weights (2 bytes / parameter)</text><rect x="57" y="177" width="1000" height="51" rx="9" fill="#233e53"/><rect x="57" y="177" width="840" height="51" rx="9" fill="#3b9fc3"/><text x="77" y="210" fill="white" font-size="21" font-weight="bold">70B × 2 bytes = 140 GB</text><text x="1080" y="210" fill="#b8d1de" font-size="16">raw</text>
<text x="58" y="282" fill="#e7f4f6" font-size="20" font-weight="bold">4-bit weights (0.5 bytes / parameter, ideal)</text><rect x="57" y="304" width="1000" height="51" rx="9" fill="#233e53"/><rect x="57" y="304" width="210" height="51" rx="9" fill="#61c9ad"/><text x="287" y="337" fill="white" font-size="20" font-weight="bold">70B × 0.5 = 35 GB + overhead</text><rect x="57" y="389" width="1090" height="59" rx="11" fill="#1c3349" stroke="#5387a0"/><text x="77" y="413" fill="#a4edf0" font-size="17" font-weight="bold">Actual runtime memory is larger than raw weights</text><text x="77" y="436" fill="#d0e1e9" font-size="15">Add KV cache, buffers, model metadata, framework overhead, and possibly training activations / optimizer states.</text></g></svg>