<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">GPU HBM, CPU DDR5 and NVMe SSD memory comparison</title><desc id="d">Shows different roles for on-accelerator HBM memory, CPU-attached system DDR5 RAM, and persistent NVMe SSD storage. Arrows represent typical movement of data into GPU for inference.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0c1b31"/><stop offset="1" stop-color="#122f40"/></linearGradient><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#60d7cf"/></marker></defs><rect width="1200" height="540" rx="18" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="55" y="54" fill="white" font-size="26" font-weight="bold">Three different jobs — not interchangeable parts</text><text x="55" y="83" fill="#bad0dc" font-size="16">GPU HBM, CPU system memory and SSD storage serve different parts of the workflow</text>
<rect x="60" y="129" width="328" height="299" rx="16" fill="#172b46" stroke="#62cbd4" stroke-width="2"/><rect x="89" y="159" width="270" height="97" rx="12" fill="#18596e"/><g fill="#90e4e3"><rect x="118" y="180" width="34" height="52" rx="3"/><rect x="162" y="180" width="34" height="52" rx="3"/><rect x="206" y="180" width="34" height="52" rx="3"/><rect x="250" y="180" width="34" height="52" rx="3"/><rect x="294" y="180" width="34" height="52" rx="3"/></g><text x="224" y="297" fill="white" font-size="24" font-weight="bold" text-anchor="middle">HBM3e / HBM4</text><text x="224" y="323" fill="#bde1e8" font-size="16" text-anchor="middle">GPU-attached memory</text><text x="224" y="353" fill="#e2edf5" font-size="15" text-anchor="middle">Fast access to active model</text><text x="224" y="376" fill="#e2edf5" font-size="15" text-anchor="middle">weights and KV cache</text><rect x="438" y="129" width="328" height="299" rx="16" fill="#172b46" stroke="#527fa5" stroke-width="2"/><rect x="471" y="159" width="262" height="97" rx="10" fill="#28526d"/><g stroke="#85d5ee" stroke-width="3" fill="none"><rect x="490" y="175" width="222" height="64" rx="7"/><path d="M513 183v48M543 183v48M573 183v48M603 183v48M633 183v48M663 183v48M690 183v48"/></g><text x="602" y="297" fill="white" font-size="24" font-weight="bold" text-anchor="middle">DDR5 ECC RDIMM</text><text x="602" y="323" fill="#bde1e8" font-size="16" text-anchor="middle">CPU / system RAM</text><text x="602" y="353" fill="#e2edf5" font-size="15" text-anchor="middle">Data loaders, host processes,</text><text x="602" y="376" fill="#e2edf5" font-size="15" text-anchor="middle">buffers and preprocessing</text>
<rect x="816" y="129" width="328" height="299" rx="16" fill="#172b46" stroke="#647b99" stroke-width="2"/><rect x="873" y="169" width="218" height="77" rx="10" fill="#29465d" stroke="#9fc3dc" stroke-width="3"/><path d="M897 195h167M897 219h167" stroke="#90dfe0" stroke-width="5"/><circle cx="1068" cy="233" r="5" fill="#83ebcd"/><text x="980" y="297" fill="white" font-size="24" font-weight="bold" text-anchor="middle">NVMe SSD</text><text x="980" y="323" fill="#bde1e8" font-size="16" text-anchor="middle">Persistent flash storage</text><text x="980" y="353" fill="#e2edf5" font-size="15" text-anchor="middle">Models, datasets, logs,</text><text x="980" y="376" fill="#e2edf5" font-size="15" text-anchor="middle">checkpoints and OS</text>
