<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Smartphone Wi-Fi and mobile data take different network routes</title><desc id="d">Original side-by-side map showing Wi-Fi path smartphone to local access point router and ISP to internet, and cellular path smartphone to 4G or 5G radio tower, mobile operator core to internet. Both routes can reach the same website or cloud model.</desc><rect width="1200" height="520" rx="18" fill="#0b1b2e"/><g font-family="Arial,sans-serif"><text x="52" y="58" fill="#f5fbff" font-size="27" font-weight="bold">Wi-Fi versus mobile data: different first hops</text><text x="52" y="89" fill="#b6d1da" font-size="16">The destination may be the same site or AI model; the access path is different</text><rect x="53" y="132" width="530" height="321" rx="16" fill="#1c3c50" stroke="#5abdbb" stroke-width="3"/><rect x="618" y="132" width="530" height="321" rx="16" fill="#18344b" stroke="#619ac1" stroke-width="3"/><text x="93" y="177" fill="#b9f4e8" font-size="22" font-weight="bold">WI-FI</text><text x="661" y="177" fill="#c4dfff" font-size="22" font-weight="bold">4G / 5G MOBILE DATA</text><g fill="#f5ffff" font-size="19" text-anchor="middle" font-weight="bold"><text x="136" y="274">Phone</text><text x="304" y="274">Router / AP</text><text x="475" y="274">ISP</text><text x="701" y="274">Phone</text><text x="869" y="274">Tower</text><text x="1045" y="274">Mobile core</text></g><g fill="#91d6d9"><rect x="103" y="210" width="66" height="39" rx="7"/><rect x="276" y="215" width="57" height="34" rx="8"/><circle cx="475" cy="225" r="28"/></g><g fill="#8bb8da"><rect x="673" y="210" width="66" height="39" rx="7"/><path d="M854 252l15-63 15 63" stroke="#8bb8da" stroke-width="5" fill="none"/><rect x="1013" y="214" width="64" height="37" rx="9"/></g><g stroke="#9ae3e0" stroke-width="3" fill="none"><path d="M175 236H266M346 236H437M744 236H829M913 236H1005"/></g><g fill="#bcd9e1" font-size="16" text-anchor="middle"><text x="316" y="333">Local Wi-Fi radio</text><text x="316" y="359">Broadband backhaul</text><text x="890" y="333">Licensed cellular radio</text><text x="890" y="359">Subscriber session</text></g><g fill="#d8f2f4" font-size="18" text-anchor="middle"><text x="316" y="412">Internet / cloud server</text><text x="890" y="412">Internet / cloud server</text></g><text x="54" y="489" fill="#b7cfdd" font-size="14">Speed depends on signal, interference, coverage, network congestion, backhaul, remote server and protocol—not only a 5G icon.</text></g></svg>