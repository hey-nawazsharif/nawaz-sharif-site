<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="t d"><title id="t">Example EV remaining range estimate from state of charge</title><desc id="d">Illustrative 60 kilowatt hour usable battery with state of charge 75 percent gives 45 kilowatt hours remaining, and at 15 kilowatt hours per 100 kilometres an ideal estimated range of 300 kilometres, excluding reserve and real-world variables.</desc><rect width="1200" height="510" rx="18" fill="#0d2135"/><g font-family="Arial,sans-serif"><text x="49" y="55" fill="white" font-size="27" font-weight="bold">EV range: an illustrative calculation</text><text x="49" y="86" fill="#bed6e0" font-size="16">This is an educational estimate, not a vehicle manufacturer's algorithm</text><rect x="61" y="150" width="525" height="110" rx="13" fill="#29475b" stroke="#76a2b0" stroke-width="3"/><rect x="67" y="156" width="388" height="98" rx="8" fill="#3ba79d"/><rect x="587" y="188" width="24" height="36" rx="3" fill="#7ba6b2"/><text x="325" y="208" text-anchor="middle" fill="white" font-size="36" font-weight="bold">75% SoC</text><text x="64" y="296" fill="#d9e9ef" font-size="18">60 kWh usable battery × 0.75 = 45 kWh available</text><rect x="656" y="145" width="485" height="183" rx="13" fill="#173c52" stroke="#57adb1" stroke-width="3"/><text x="899" y="201" text-anchor="middle" fill="#b6eff0" font-size="19">ASSUMED CONSUMPTION</text><text x="899" y="253" text-anchor="middle" fill="white" font-size="38" font-weight="bold">15 kWh / 100 km</text><path d="M68 344H1129" stroke="#416c83" stroke-width="2"/><text x="70" y="392" fill="#d6e5ec" font-size="23">Range ≈ 45 ÷ 15 × 100</text><text x="70" y="440" fill="#70e1d1" font-size="41" font-weight="bold">≈ 300 km</text><text x="457" y="432" fill="#afcbd8" font-size="15">Actual range changes with temperature, driving, roads,</text><text x="457" y="455" fill="#afcbd8" font-size="15">auxiliary loads, reserve and BMS estimation strategy.</text></g></svg>