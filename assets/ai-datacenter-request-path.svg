<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">How AI requests move through data-centre hardware</title><desc id="desc">From a user's phone through the network, CPU and DDR5 memory to GPU and its local HBM, with NVMe storage loading model files; answer returns to the user.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09172b"/><stop offset="1" stop-color="#132d3b"/></linearGradient><linearGradient id="blue" x2="1"><stop stop-color="#2475b9"/><stop offset="1" stop-color="#3b9ac2"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#62d8da"/></marker></defs><rect width="1200" height="500" rx="18" fill="url(#bg)"/><text x="48" y="56" font-family="Arial,sans-serif" fill="#f4f8fb" font-size="26" font-weight="bold">Where the AI model actually runs</text><text x="48" y="88" font-family="Arial,sans-serif" fill="#a7bdcc" font-size="16">Simplified cloud inference path · original educational schematic</text>
