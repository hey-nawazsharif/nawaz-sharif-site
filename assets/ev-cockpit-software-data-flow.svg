<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">EV infotainment system architecture and vehicle data flow</title><desc id="d">Concept diagram showing battery management system, vehicle ECUs and sensors over CAN or Automotive Ethernet, secure gateway, vehicle property service or HAL, cockpit SoC with RAM storage and graphics, then driver cluster and infotainment displays; not all implementations use Android.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#69d5d3"/></marker></defs><rect width="1200" height="630" rx="18" fill="#0a2033"/><g font-family="Arial,sans-serif"><text x="47" y="52" fill="white" font-size="27" font-weight="bold">How battery and vehicle data reach the screens</text><text x="47" y="81" fill="#b3d1dd" font-size="16">A simplified example, not the wiring diagram of a named vehicle</text><g fill="#17384d" stroke="#547c95" stroke-width="2"><rect x="47" y="129" width="294" height="128" rx="13"/><rect x="47" y="278" width="294" height="128" rx="13"/><rect x="47" y="427" width="294" height="128" rx="13"/></g><g fill="white" font-size="21" font-weight="bold"><text x="70" y="169">Battery BMS</text><text x="70" y="318">Vehicle ECUs</text><text x="70" y="467">Sensors / connectivity</text></g><g fill="#c1d9e5" font-size="15"><text x="70" y="197">State of charge / temperature</text><text x="70" y="346">Speed / doors / warnings</text><text x="70" y="495">GPS / cameras / cellular</text></g><rect x="396" y="242" width="188" height="187" rx="14" fill="#194657" stroke="#6ccbd0" stroke-width="3"/><text x="490" y="292" fill="white" font-size="21" font-weight="bold" text-anchor="middle">GATEWAY</text><text x="490" y="321" fill="#b4e5e5" font-size="16" text-anchor="middle">CAN / Ethernet</text><text x="490" y="350" fill="#b4e5e5" font-size="15" text-anchor="middle">Access rules</text><text x="490" y="375" fill="#b4e5e5" font-size="15" text-anchor="middle">Filtered data</text><path d="M344 198H365V335H393M344 339H393M344 485H365V335" fill="none" stroke="#69d5d3" stroke-width="3" marker-end="url(#arr)"/><rect x="638" y="238" width="252" height="195" rx="14" fill="#22566b" stroke="#7cdde1" stroke-width="3"/><text x="764" y="274" fill="white" font-size="22" font-weight="bold" text-anchor="middle">COCKPIT SoC</text><text x="764" y="310" fill="#c1e9ed" font-size="16" text-anchor="middle">CPU / GPU / NPU*</text><text x="764" y="341" fill="#c1e9ed" font-size="16" text-anchor="middle">RAM / flash storage</text><text x="764" y="372" fill="#c1e9ed" font-size="16" text-anchor="middle">OS / middleware / UI</text><text x="764" y="404" fill="#c1e9ed" font-size="14" text-anchor="middle">Vehicle data API where used</text><path d="M589 335H634" stroke="#69d5d3" stroke-width="3" marker-end="url(#arr)"/><g fill="#19394d" stroke="#648ea5" stroke-width="2"><rect x="946" y="188" width="211" height="117" rx="13"/><rect x="946" y="333" width="211" height="117" rx="13"/></g><g fill="#ecffff" font-size="19" font-weight="bold" text-anchor="middle"><text x="1051" y="233">Driver display</text><text x="1051" y="378">Infotainment</text></g><g fill="#c3d9e4" font-size="14" text-anchor="middle"><text x="1051" y="261">Speed / battery</text><text x="1051" y="404">Navigation / media</text></g><path d="M894 335H920V245H943M920 388H943" fill="none" stroke="#69d5d3" stroke-width="3" marker-end="url(#arr)"/><text x="49" y="595" fill="#b4d0db" font-size="14">*Hardware and software are manufacturer-specific. Safety-critical driver information can be isolated in a separate domain or OS.</text></g></svg>