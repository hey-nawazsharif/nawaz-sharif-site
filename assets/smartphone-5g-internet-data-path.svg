<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d"><title id="t">How phone data travels over a 5G mobile network to internet servers</title><desc id="d">Original diagram: mobile app and phone modem transmit radio signals to cell-site 5G gNodeB or LTE eNodeB, then through a mobile operator core network to the internet and destination server; separate SIM profile authenticates subscriber, and secured application data flows back.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6cdbd9"/></marker><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0b1c32"/><stop offset="1" stop-color="#123b48"/></linearGradient></defs><rect width="1200" height="580" rx="18" fill="url(#g)"/><g font-family="Arial,sans-serif"><text x="50" y="56" fill="white" font-size="27" font-weight="bold">From your phone to the internet, step by step</text><text x="50" y="85" fill="#b8d4e1" font-size="15">Simplified mobile-data path; 4G LTE, 5G NSA and 5G SA use different radio/core combinations</text><g fill="#183a50" stroke="#5a9fb2" stroke-width="2"><rect x="50" y="151" width="215" height="250" rx="15"/><rect x="330" y="151" width="215" height="250" rx="15"/><rect x="610" y="151" width="245" height="250" rx="15"/><rect x="920" y="151" width="230" height="250" rx="15"/></g><rect x="112" y="180" width="91" height="117" rx="13" fill="#28627b" stroke="#a2dfe3" stroke-width="3"/><rect x="128" y="198" width="59" height="71" rx="7" fill="#a2eff2"/><circle cx="158" cy="286" r="4" fill="#a2eff2"/><g fill="#f5ffff" font-size="21" text-anchor="middle" font-weight="bold"><text x="157" y="334">Phone</text><text x="437" y="334">Cell tower</text><text x="732" y="334">Operator core</text><text x="1035" y="334">Internet server</text></g><g fill="#bfdce4" font-size="15" text-anchor="middle"><text x="157" y="362">App → OS → modem</text><text x="437" y="362">Radio access</text><text x="732" y="362">Data routing / session</text><text x="1035" y="362">Website / AI service</text></g><g stroke="#87e2dd" stroke-width="6" fill="none"><path d="M436 199v100M401 230h70M409 256h55M420 195l16-30 16 30"/></g><g fill="#74c5d3"><circle cx="1035" cy="225" r="48"/><rect x="1003" y="255" width="64" height="47" rx="7" fill="#36778b"/></g><g stroke="#6cdbd9" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M268 263H325"/><path d="M548 263H606"/><path d="M858 263H916"/></g><g fill="#99e6e1" font-size="14" text-anchor="middle"><text x="294" y="238">RF</text><text x="577" y="238">Backhaul</text><text x="887" y="238">IP</text></g><path d="M1035 422V457H158V424" fill="none" stroke="#65b9d4" stroke-width="3" stroke-dasharray="9 6"/><text x="596" y="449" fill="#dbf5f6" text-anchor="middle" font-size="16">Answer / webpage data returns through the network</text><text x="51" y="508" fill="#c1dce5" font-size="15">SIM/eSIM: subscriber credentials used for network authentication. Not a source of internet data.</text><text x="51" y="539" fill="#a5c4d3" font-size="14">HTTPS/TLS can protect app content end to end to the selected service. Operators still route packets; not all metadata is hidden.</text></g></svg>