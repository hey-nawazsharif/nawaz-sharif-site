<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="t d"><title id="t">Inside a smartphone: SoC, modem, RAM, storage, radio and battery</title><desc id="d">Original simplified cutaway of smartphone components, highlighting integrated CPU GPU NPU and ISP SoC, modem and radio RF circuits, LPDDR RAM, UFS flash storage, antenna, camera, Wi-Fi Bluetooth controller and battery. Not a teardown of a specific phone.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1c31"/><stop offset="1" stop-color="#153b4a"/></linearGradient></defs><rect width="1200" height="590" rx="18" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="48" y="57" fill="#f4faff" font-size="27" font-weight="bold">What is actually inside a smartphone?</text><text x="48" y="87" fill="#b6d1da" font-size="16">Simplified electronics layout; chip integration and position vary by device</text><rect x="390" y="114" width="415" height="420" rx="44" fill="#142b3e" stroke="#94c6d2" stroke-width="5"/><rect x="410" y="136" width="375" height="378" rx="27" fill="#1b394a"/><rect x="520" y="151" width="155" height="20" rx="8" fill="#709faf"/><g fill="#2e6780" stroke="#75cad1" stroke-width="2"><rect x="453" y="192" width="140" height="122" rx="12"/><rect x="609" y="192" width="140" height="122" rx="12"/><rect x="453" y="332" width="140" height="72" rx="10"/><rect x="609" y="332" width="140" height="72" rx="10"/></g><g text-anchor="middle" fill="#f1feff" font-size="19" font-weight="bold"><text x="523" y="231">SoC</text><text x="523" y="257" font-size="15">CPU + GPU</text><text x="523" y="279" font-size="15">NPU + ISP</text><text x="679" y="238">Modem</text><text x="679" y="262" font-size="15">+ RF circuits</text><text x="523" y="364">LPDDR</text><text x="523" y="386" font-size="14">working RAM</text><text x="679" y="364">UFS flash</text><text x="679" y="386" font-size="14">app storage</text></g><rect x="460" y="429" width="278" height="58" rx="11" fill="#226767" stroke="#70c9bd" stroke-width="3"/><text x="599" y="463" text-anchor="middle" fill="white" font-size="20" font-weight="bold">Battery + power IC</text><g fill="#ddeff5" font-size="17"><text x="50" y="202">Application processor</text><text x="50" y="225" font-size="14" fill="#a9cbd5">Apps, graphics, on-device AI</text><path d="M295 206H447" stroke="#73d9d5" stroke-width="3"/><text x="50" y="357">System RAM / storage</text><text x="50" y="380" font-size="14" fill="#a9cbd5">Temporary vs persistent files</text><path d="M305 363H447" stroke="#73d9d5" stroke-width="3"/><text x="834" y="206">Cellular radio</text><text x="834" y="230" font-size="14" fill="#a9cbd5">Modem, antenna and filters</text><path d="M752 212H826" stroke="#73d9d5" stroke-width="3"/><text x="835" y="345">Wi-Fi / Bluetooth</text><text x="835" y="368" font-size="14" fill="#a9cbd5">Separate local radio path</text><path d="M752 351H826" stroke="#73d9d5" stroke-width="3"/><text x="835" y="476">Power management</text><text x="835" y="498" font-size="14" fill="#a9cbd5">Energy and charging control</text><path d="M741 457H826" stroke="#73d9d5" stroke-width="3"/></g><text x="49" y="557" fill="#bcd5df" font-size="14">Many designs combine functions on one package; some use separate modem or radio chips. SIM/eSIM credentials are distinct from the app processor.</text></svg>