<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="t d"><title id="t">From hardware parts to working secure server</title><desc id="d">Eight stages: plan a service; select compatible equipment; assemble safely; connect UPS and network; configure firmware and storage; install Ubuntu Server from USB; establish SSH and firewall; test service backups and monitoring.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#6fdbd9"/></marker></defs><rect width="1200" height="610" rx="18" fill="#0c1c32"/><g font-family="Arial,sans-serif"><text x="56" y="58" fill="white" font-size="27" font-weight="bold">From zero to a working server</text><text x="56" y="88" fill="#b3cbd9" font-size="16">Beginner-safe lab workflow — no exposed internet ports required</text><g fill="#1b3c50" stroke="#559bad" stroke-width="2"><rect x="54" y="130" width="248" height="159" rx="13"/><rect x="334" y="130" width="248" height="159" rx="13"/><rect x="614" y="130" width="248" height="159" rx="13"/><rect x="894" y="130" width="248" height="159" rx="13"/><rect x="54" y="347" width="248" height="159" rx="13"/><rect x="334" y="347" width="248" height="159" rx="13"/><rect x="614" y="347" width="248" height="159" rx="13"/><rect x="894" y="347" width="248" height="159" rx="13"/></g><g font-weight="bold" fill="#70dadb" font-size="31"><text x="78" y="178">01</text><text x="358" y="178">02</text><text x="638" y="178">03</text><text x="918" y="178">04</text><text x="78" y="395">05</text><text x="358" y="395">06</text><text x="638" y="395">07</text><text x="918" y="395">08</text></g><g fill="#f1f9fb" font-size="20" font-weight="bold"><text x="78" y="216">Decide purpose</text><text x="358" y="216">Choose parts</text><text x="638" y="216">Assemble</text><text x="918" y="216">Power / network</text><text x="78" y="433">Firmware / disks</text><text x="358" y="433">Install OS</text><text x="638" y="433">Harden access</text><text x="918" y="433">Service / backup</text></g><g fill="#bdd5df" font-size="15"><text x="78" y="251">Users + data + role</text><text x="358" y="251">CPU, ECC, SSD, NIC</text><text x="638" y="251">Compatibility / ESD</text><text x="918" y="251">UPS, LAN, console</text><text x="78" y="468">UEFI, boot mode, RAID</text><text x="358" y="468">Ubuntu Server USB</text><text x="638" y="468">SSH key, UFW, updates</text><text x="918" y="468">HTTP, restore, monitor</text></g><path d="M306 210h24M586 210h24M866 210h24M1010 300v40H176v5M306 426h24M586 426h24M866 426h24" fill="none" stroke="#6fdbd9" stroke-width="3" marker-end="url(#a)"/><text x="58" y="557" fill="#c0d9e5" font-size="15">Checkpoint: identify disk before formatting, keep SSH access while enabling firewall, and prove a backup restore.</text></g></svg>