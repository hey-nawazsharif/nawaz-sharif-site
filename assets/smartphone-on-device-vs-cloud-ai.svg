<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="595" viewBox="0 0 1200 595" role="img" aria-labelledby="t d"><title id="t">On-device AI versus cloud AI: where the model performs inference</title><desc id="d">Two parallel pathways: local on-device processing with app, AI runtime, NPU GPU or CPU and local result; cloud processing with app, encrypted network, data-centre model inference, and result. Both require app permissions and model capacity considerations.</desc><rect width="1200" height="595" rx="18" fill="#0d1d32"/><g font-family="Arial,sans-serif"><text x="49" y="56" fill="white" font-size="28" font-weight="bold">Where does the AI model actually run?</text><text x="49" y="86" fill="#b6d2dd" font-size="16">An “AI app” does not prove the phone's NPU is processing its answers</text><rect x="56" y="126" width="1088" height="183" rx="17" fill="#1a4050" stroke="#65cbbd" stroke-width="3"/><text x="86" y="163" fill="#b6fff0" font-size="22" font-weight="bold">ON-DEVICE AI</text><g fill="#235a6c" stroke="#67bcbc" stroke-width="2"><rect x="84" y="183" width="220" height="91" rx="11"/><rect x="397" y="183" width="220" height="91" rx="11"/><rect x="709" y="183" width="220" height="91" rx="11"/><rect x="968" y="188" width="150" height="82" rx="11"/></g><g fill="white" font-size="17" text-anchor="middle" font-weight="bold"><text x="194" y="220">App input</text><text x="507" y="220">Local model</text><text x="819" y="220">NPU / GPU / CPU</text><text x="1043" y="220">Result</text></g><g fill="#c4e7e7" font-size="13" text-anchor="middle"><text x="194" y="243">Text / camera input</text><text x="507" y="243">Stored on device</text><text x="819" y="243">Local calculation</text><text x="1043" y="243">No cloud needed*</text></g><g stroke="#83e0d2" stroke-width="3" fill="none"><path d="M307 230H393M620 230H705M932 230H964"/></g><rect x="56" y="340" width="1088" height="193" rx="17" fill="#182d48" stroke="#609ec7" stroke-width="3"/><text x="86" y="377" fill="#d8f1ff" font-size="22" font-weight="bold">CLOUD AI</text><g fill="#2d5471" stroke="#79a4c2" stroke-width="2"><rect x="84" y="403" width="220" height="93" rx="11"/><rect x="397" y="403" width="220" height="93" rx="11"/><rect x="709" y="403" width="220" height="93" rx="11"/><rect x="968" y="408" width="150" height="83" rx="11"/></g><g fill="white" font-size="17" text-anchor="middle" font-weight="bold"><text x="194" y="439">App request</text><text x="507" y="439">Wi-Fi / cellular</text><text x="819" y="439">AI server</text><text x="1043" y="441">Response</text></g><g fill="#c6dceb" font-size="13" text-anchor="middle"><text x="194" y="464">Input from phone</text><text x="507" y="464">HTTPS transport</text><text x="819" y="464">Remote inference</text><text x="1043" y="464">Back to app</text></g><g stroke="#84c3e4" stroke-width="3" fill="none"><path d="M307 448H393M620 448H705M932 448H964"/></g><text x="55" y="568" fill="#b3d0df" font-size="14">*Local work can still require internet for downloads, updates, login or some optional features; cloud handling depends on each provider.</text></g></svg>